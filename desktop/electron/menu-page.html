<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #faf7f2; color: #1f2a2e;
  max-width: 440px; margin: 0 auto; min-height: 100vh;
}
.header {
  background: #1f2a2e; color: #faf7f2;
  padding: 16px; position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; gap: 10;
}
.header h1 { font-size: 18px; font-weight: 800; flex: 1; }
.header .table-label { font-size: 12px; opacity: .6; }

/* ── Section headers ── */
.section-header {
  padding: 14px 16px 8px;
  font-size: 11px; font-weight: 800; text-transform: uppercase;
  letter-spacing: 1.2px; color: #0f766e;
}

/* ── Formula cards ── */
.formula-card {
  background: white; margin: 0 12px 10px;
  border-radius: 14px; border: 1.5px solid #0f766e22;
  overflow: hidden; box-shadow: 0 2px 8px rgba(15,118,110,0.08);
}
.formula-header {
  padding: 14px 16px;
  display: flex; align-items: flex-start; gap: 10; cursor: pointer;
}
.formula-icon { font-size: 22px; }
.formula-name { font-weight: 800; font-size: 15px; }
.formula-desc { font-size: 12px; color: #888; margin-top: 3px; }
.formula-price { font-weight: 900; color: #0f766e; font-size: 15px; white-space: nowrap; }
.formula-choose-btn {
  display: block; width: calc(100% - 28px); margin: 0 14px 14px;
  padding: 12px; border-radius: 10px; border: none;
  background: #0f766e; color: white; font-size: 14px; font-weight: 700;
  cursor: pointer; text-align: center;
}
.formula-choose-btn:disabled { background: #ccc; cursor: default; }
.formula-choose-btn.added { background: #16a34a; }
.formula-added-summary {
  margin: 0 14px 14px; padding: 10px 12px;
  background: #f0fdf4; border-radius: 10px; border: 1px solid #bbf7d0;
  font-size: 12px; color: #15803d;
}
.formula-added-summary .choices-list { margin-top: 4px; }
.formula-added-summary .choice-row { padding: 2px 0; }
.formula-added-actions {
  display: flex; gap: 6px; margin-top: 8px;
}
.btn-small {
  padding: 6px 12px; border-radius: 7px; border: none;
  font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit;
}
.btn-small.edit { background: #e0f2fe; color: #0369a1; }
.btn-small.remove { background: #fee2e2; color: #dc2626; }

/* ── Step wizard overlay ── */
.wizard-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.55); z-index: 400;
  align-items: flex-end; justify-content: center;
}
.wizard-overlay.open { display: flex; }
.wizard-box {
  background: white; border-radius: 20px 20px 0 0;
  width: 100%; max-width: 440px; max-height: 80vh; overflow-y: auto;
  padding: 20px;
}
.wizard-progress {
  display: flex; gap: 4px; margin-bottom: 16px;
}
.wizard-dot {
  height: 4px; flex: 1; border-radius: 2px; background: #e0e0e0;
}
.wizard-dot.done { background: #0f766e; }
.wizard-title {
  font-size: 13px; color: #888; margin-bottom: 4px;
}
.wizard-course-name {
  font-size: 18px; font-weight: 800; margin-bottom: 14px;
}
.option-btn {
  display: flex; align-items: center; gap: 10;
  width: 100%; padding: 12px 14px; margin-bottom: 8px;
  border-radius: 10px; border: 1.5px solid #e0e0e0;
  background: white; cursor: pointer; text-align: left;
  font-size: 14px; font-family: inherit; color: #1f2a2e;
  transition: border-color .15s, background .15s;
}
.option-btn:hover { border-color: #0f766e22; background: #f0fdf4; }
.option-btn.selected { border-color: #0f766e; background: #f0fdf4; color: #0f766e; font-weight: 700; }
.option-radio {
  width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0;
  border: 2px solid #ccc; display: flex; align-items: center; justify-content: center;
}
.option-btn.selected .option-radio { border-color: #0f766e; }
.option-radio-inner {
  width: 8px; height: 8px; border-radius: 50%; background: #0f766e; display: none;
}
.option-btn.selected .option-radio-inner { display: block; }
.wizard-nav {
  display: flex; gap: 8px; margin-top: 16px;
}
.wizard-btn {
  padding: 13px; border-radius: 10px; border: none;
  font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
}
.wizard-btn.back { background: #f0ede9; color: #666; flex: 0 0 80px; }
.wizard-btn.next { background: #0f766e; color: white; flex: 1; }
.wizard-btn.next:disabled { background: #ccc; cursor: default; }

/* ── Extras section ── */
.category { padding: 10px 12px 0; }
.category h2 {
  font-size: 13px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1px;
  color: #0f766e; margin-bottom: 8px;
}
.item {
  background: white; border-radius: 12px; padding: 12px 14px;
  margin-bottom: 8px; display: flex; justify-content: space-between;
  align-items: flex-start; border: 1px solid rgba(31,42,46,0.08); gap: 10px;
}
.item-info { flex: 1; }
.item-info .name-fr { font-weight: 700; font-size: 14px; }
.item-info .name-ar { font-size: 12px; color: #888; direction: rtl; }
.item-info .desc    { font-size: 11px; color: #666; margin-top: 2px; }
.item-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.item-price { font-weight: 800; color: #0f766e; white-space: nowrap; font-size: 14px; }
.qty-control { display: flex; align-items: center; gap: 8px; }
.qty-btn {
  width: 28px; height: 28px; border-radius: 50%; border: none;
  background: #0f766e; color: white; font-size: 18px; line-height: 1;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.qty-btn:active { background: #0a5c56; }
.qty-display { font-weight: 700; font-size: 14px; min-width: 20px; text-align: center; }

/* ── Cart bar ── */
.cart-bar {
  display: none; position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 440px;
  background: #0f766e; color: white; padding: 14px 20px;
  font-weight: 800; font-size: 15px; cursor: pointer;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.15); z-index: 200;
  justify-content: space-between; align-items: center;
}

/* ── Order modal ── */
.order-modal {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.5); z-index: 300;
  align-items: flex-end;
}
.order-modal-content {
  background: white; border-radius: 20px 20px 0 0;
  padding: 20px; max-height: 80vh; overflow-y: auto;
  width: 100%; max-width: 440px; margin: 0 auto;
}
.confirm-btn {
  width: 100%; padding: 14px; border-radius: 10px; border: none;
  background: #0f766e; color: white; font-size: 16px; font-weight: 800;
  cursor: pointer; margin-top: 16px;
}
.confirm-btn:disabled { opacity: 0.6; cursor: default; }

/* ── Success ── */
.success-screen {
  display: none; text-align: center; padding: 60px 20px;
}
.success-icon { font-size: 64px; margin-bottom: 16px; }
.success-title { font-size: 22px; font-weight: 900; color: #0f766e; }
.success-sub { font-size: 14px; color: #888; margin-top: 8px; line-height: 1.6; }
.loading { text-align: center; padding: 60px 20px; color: #888; font-size: 14px; }

/* ── Order item rows in modal ── */
.order-row { padding: 8px 0; border-bottom: 1px solid #f0ede9; }
.order-row-title { font-weight: 700; font-size: 13px; }
.order-row-detail { font-size: 11px; color: #888; margin-top: 2px; }
.order-row-price { font-weight: 700; font-size: 13px; color: #0f766e; float: right; }
</style>
</head>
<body>

<div id="menu-screen">
  <div class="header">
    <div style="flex:1">
      <h1 id="restaurant-name">Menu</h1>
      <div class="table-label">__TABLE_LABEL__</div>
    </div>
  </div>
  <div id="menu-content"><div class="loading">Chargement du menu...</div></div>
  <div style="height:90px"></div>
</div>

<div class="cart-bar" id="cart-bar" onclick="openOrder()">
  <span id="cart-count">0 article(s)</span>
  <span>Voir la commande →</span>
</div>

<!-- Order review modal -->
<div class="order-modal" id="order-modal">
  <div class="order-modal-content">
    <h2 style="font-size:18px;font-weight:800;margin-bottom:16px">Ma commande</h2>
    <div id="order-items-list"></div>
    <div style="margin-top:12px">
      <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px">Note pour la cuisine (optionnel) :</label>
      <textarea id="order-notes" rows="2" style="width:100%;padding:10px;border-radius:8px;border:1.5px solid #ddd;font-size:13px;font-family:inherit;resize:none"></textarea>
    </div>
    <div id="order-total" style="font-size:16px;font-weight:800;color:#0f766e;margin-top:12px;text-align:right"></div>
    <button class="confirm-btn" id="send-btn" onclick="submitOrder()">✓ Envoyer la commande</button>
    <button onclick="closeOrder()" style="width:100%;padding:12px;border:none;background:none;color:#888;margin-top:8px;cursor:pointer;font-size:14px">Annuler</button>
  </div>
</div>

<div class="success-screen" id="success-screen">
  <div class="success-icon">✅</div>
  <div class="success-title">Commande envoyée !</div>
  <div class="success-sub">La cuisine a reçu votre commande.<br>Nous vous apportons ça rapidement.</div>
</div>

<script>
const PROPERTY_ID = '__PROPERTY_ID__';
const TABLE_ID    = '__TABLE_ID__';
const TABLE_LABEL = '__TABLE_LABEL__';
const SESSION     = Math.random().toString(36).slice(2);

// Global formula list — safe to reference from onclick handlers
let allFormulas = [];

// Cart: { type:'item', id, name_fr, name_ar, price, qty }
//     | { type:'formula', formula_id, name_fr, price, qty:1, choices:{courseName:optionName} }
let cartItems = [];

// Per-formula wizard state (supports one active wizard at a time)
let _wiz = { formulaId: null, step: 0, choices: {} };

// ── Helpers ────────────────────────────────────────────────────────────────
function escH(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function mealIcon(t) {
  return { breakfast:'🌅', lunch:'🌞', dinner:'🌙', custom:'⭐' }[t] || '🍽️';
}

// ── Load menu ──────────────────────────────────────────────────────────────
async function loadMenu() {
  try {
    const res  = await fetch('/api/menu?p=' + PROPERTY_ID);
    const data = await res.json();
    allFormulas = data.formulas || [];
    const categories = data.categories || [];
    const property   = data.property   || {};
    document.getElementById('restaurant-name').textContent =
      property.restaurant_name || property.display_name || 'Menu';
    renderMenu(allFormulas, categories);
  } catch(e) {
    document.getElementById('menu-content').innerHTML =
      '<div class="loading">Erreur de chargement. Vérifiez votre connexion WiFi.</div>';
  }
}

function renderMenu(formulas, categories) {
  const el = document.getElementById('menu-content');
  let html = '';

  if (formulas.length > 0) {
    html += '<div class="section-header">🍽️ Nos Formules</div>';
    for (const f of formulas) {
      // SAFE: only pass the UUID (no user content, no escaping needed)
      html += `
        <div class="formula-card" id="fc-${f.id}">
          <div class="formula-header">
            <span class="formula-icon">${mealIcon(f.meal_type)}</span>
            <div style="flex:1">
              <div class="formula-name">${escH(f.name_fr)}</div>
              ${f.description_fr ? `<div class="formula-desc">${escH(f.description_fr)}</div>` : ''}
            </div>
            <div class="formula-price">${f.price} MAD</div>
          </div>
          <div id="fs-${f.id}">
            <button class="formula-choose-btn" onclick="selectFormula('${f.id}')">
              Choisir ce menu ▼
            </button>
          </div>
          <div id="formula-steps-${f.id}" style="display:none;padding:0 14px 14px"></div>
        </div>`;
    }
  }

  if (categories.length > 0) {
    if (formulas.length > 0) {
      html += '<div class="section-header" style="margin-top:8px">➕ Suppléments &amp; Extras</div>';
      html += '<div style="padding:0 12px 6px;font-size:12px;color:#888">Souhaitez-vous ajouter autre chose ?</div>';
    }
    for (const cat of categories) {
      if (!(cat.items || []).length) continue;
      html += `<div class="category"><h2>${escH(cat.name_fr)}${cat.name_ar ? ' · ' + escH(cat.name_ar) : ''}</h2>`;
      for (const item of cat.items) {
        // Extra items: only pass the UUID as onclick arg
        html += `
          <div class="item">
            <div class="item-info">
              <div class="name-fr">${escH(item.name_fr)}</div>
              ${item.name_ar ? '<div class="name-ar">' + escH(item.name_ar) + '</div>' : ''}
              ${item.description_fr ? '<div class="desc">' + escH(item.description_fr) + '</div>' : ''}
            </div>
            <div class="item-right">
              <div class="item-price">${item.price} MAD</div>
              <div class="qty-control">
                <button class="qty-btn" onclick="adjustExtra('${item.id}',-1)">−</button>
                <span class="qty-display" id="qty-${item.id}">0</span>
                <button class="qty-btn" onclick="adjustExtra('${item.id}',1)">+</button>
              </div>
            </div>
          </div>`;
      }
      html += '</div>';
    }
  }

  if (!formulas.length && !categories.length) {
    html = '<div class="loading">Menu vide pour le moment.</div>';
  }
  el.innerHTML = html;

  // Store extra item data by id for adjustExtra lookup (avoids inline strings)
  window._extraItems = {};
  for (const cat of categories) {
    for (const item of (cat.items || [])) {
      window._extraItems[item.id] = item;
    }
  }
}

// ── Extras ─────────────────────────────────────────────────────────────────
function adjustExtra(id, delta) {
  const item = (window._extraItems || {})[id];
  if (!item) return;
  let entry = cartItems.find(i => i.type === 'item' && i.id === id);
  if (!entry) {
    entry = { type: 'item', id, name_fr: item.name_fr, name_ar: item.name_ar || '', price: item.price, qty: 0 };
    cartItems.push(entry);
  }
  entry.qty = Math.max(0, entry.qty + delta);
  if (entry.qty === 0) cartItems.splice(cartItems.indexOf(entry), 1);
  const el = document.getElementById('qty-' + id);
  if (el) el.textContent = entry.qty || 0;
  updateCartBar();
}

// ── Formula selection (inline steps) ──────────────────────────────────────

window.selectFormula = function(formulaId) {
  const formula = allFormulas.find(f => f.id === formulaId);
  if (!formula) return;
  const courses = (formula.courses || []).filter(c => c.must_choose);

  if (courses.length === 0) {
    // No courses to choose — add directly
    addFormulaToCart(formulaId, {});
    return;
  }

  // Reset wizard for this formula
  _wiz = { formulaId, step: 0, choices: {} };
  showFormulaStep(formulaId, 0);
};

window.showFormulaStep = function(formulaId, stepIndex) {
  const formula = allFormulas.find(f => f.id === formulaId);
  if (!formula) return;
  const courses = (formula.courses || []).filter(c => c.must_choose);
  const course  = courses[stepIndex];
  if (!course) return;

  _wiz.formulaId = formulaId;
  _wiz.step      = stepIndex;

  const container = document.getElementById('formula-steps-' + formulaId);
  if (!container) return;
  container.style.display = 'block';

  // Build option rows using numeric indices — no user strings in onclick
  const optRows = (course.options || []).map((opt, optIdx) => `
    <div onclick="pickOption('${formulaId}',${stepIndex},${optIdx})"
      id="opt-${formulaId}-${stepIndex}-${optIdx}"
      style="display:flex;align-items:center;gap:10px;padding:11px 14px;
        margin-bottom:6px;background:white;border-radius:10px;
        border:1.5px solid #ddd;cursor:pointer;user-select:none">
      <span style="width:20px;height:20px;border-radius:50%;border:2px solid #ccc;
        display:flex;align-items:center;justify-content:center;flex-shrink:0"
        id="radio-${formulaId}-${stepIndex}-${optIdx}">
      </span>
      <span style="font-size:14px">${escH(opt.name_fr)}</span>
    </div>`).join('');

  const backBtn = stepIndex > 0
    ? `<button onclick="showFormulaStep('${formulaId}',${stepIndex - 1})"
        style="flex:1;padding:12px;border-radius:10px;border:1.5px solid #ddd;
        background:white;font-size:14px;cursor:pointer;font-family:inherit">← Retour</button>`
    : `<button onclick="document.getElementById('formula-steps-${formulaId}').style.display='none'"
        style="flex:1;padding:12px;border-radius:10px;border:1.5px solid #ddd;
        background:white;font-size:14px;cursor:pointer;font-family:inherit">Annuler</button>`;

  container.innerHTML = `
    <div style="background:#f0fdf9;border-radius:12px;border:2px solid #0f766e;padding:16px">
      <div style="font-size:11px;color:#0f766e;font-weight:800;text-transform:uppercase;
        letter-spacing:.8px;margin-bottom:4px">
        Étape ${stepIndex + 1} / ${courses.length}
      </div>
      <div style="font-size:16px;font-weight:800;margin-bottom:12px">
        ${escH(course.name_fr)}
      </div>
      ${optRows}
      <div style="display:flex;gap:8px;margin-top:4px">
        ${backBtn}
      </div>
    </div>`;
};

window.pickOption = function(formulaId, stepIndex, optIdx) {
  const formula = allFormulas.find(f => f.id === formulaId);
  if (!formula) return;
  const courses = (formula.courses || []).filter(c => c.must_choose);
  const course  = courses[stepIndex];
  const opt     = (course.options || [])[optIdx];
  if (!opt) return;

  // Store choice by course name
  _wiz.choices[course.name_fr] = opt.name_fr;

  // Visual: highlight selected row
  (course.options || []).forEach((_, i) => {
    const row   = document.getElementById(`opt-${formulaId}-${stepIndex}-${i}`);
    const radio = document.getElementById(`radio-${formulaId}-${stepIndex}-${i}`);
    if (row)   { row.style.borderColor = i === optIdx ? '#0f766e' : '#ddd'; row.style.background = i === optIdx ? '#f0fdf4' : 'white'; }
    if (radio) { radio.innerHTML = i === optIdx ? '<div style="width:10px;height:10px;border-radius:50%;background:#0f766e"></div>' : ''; radio.style.borderColor = i === optIdx ? '#0f766e' : '#ccc'; }
  });

  // Advance after short delay so user sees the highlight
  setTimeout(function() {
    const nextStep = stepIndex + 1;
    if (nextStep < courses.length) {
      showFormulaStep(formulaId, nextStep);
    } else {
      addFormulaToCart(formulaId, Object.assign({}, _wiz.choices));
      _wiz = { formulaId: null, step: 0, choices: {} };
    }
  }, 260);
};

window.addFormulaToCart = function(formulaId, choices) {
  const formula = allFormulas.find(f => f.id === formulaId);
  if (!formula) return;

  cartItems.push({
    type: 'formula',
    formula_id: formulaId,
    name_fr: formula.name_fr,
    price: formula.price,
    qty: 1,
    choices: choices,
  });

  updateCartBar();
  showFormulaSuccess(formulaId, choices);
};

window.showFormulaSuccess = function(formulaId, choices) {
  const formula = allFormulas.find(f => f.id === formulaId);
  if (!formula) return;
  const container = document.getElementById('formula-steps-' + formulaId);
  if (!container) return;
  container.style.display = 'block';

  const choiceRows = Object.entries(choices)
    .map(([c, o]) => `<div style="font-size:12px;color:#15803d">${escH(c)}: <strong>${escH(o)}</strong></div>`)
    .join('');

  // Count how many of this formula are in cart
  const count = cartItems.filter(i => i.type === 'formula' && i.formula_id === formulaId).length;

  container.innerHTML = `
    <div style="background:#f0fdf4;border-radius:12px;border:2px solid #16a34a;padding:14px">
      <div style="color:#15803d;font-weight:800;font-size:14px;margin-bottom:6px">
        ✅ ${escH(formula.name_fr)} ajouté — ${formula.price} MAD
      </div>
      ${choiceRows}
      <div style="display:flex;gap:8px;margin-top:10px">
        <button onclick="removeLastFormula('${formulaId}')"
          style="padding:8px 14px;border-radius:8px;border:1.5px solid #ff7f50;
          background:white;color:#ff7f50;cursor:pointer;font-size:12px;font-family:inherit">
          🗑️ Annuler
        </button>
        <button onclick="selectFormula('${formulaId}')"
          style="flex:1;padding:8px 14px;border-radius:8px;border:1.5px solid #0f766e;
          background:white;color:#0f766e;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit">
          + Ajouter une autre personne
        </button>
      </div>
    </div>`;
};

window.removeLastFormula = function(formulaId) {
  // Remove the most recently added entry for this formula
  for (let i = cartItems.length - 1; i >= 0; i--) {
    if (cartItems[i].type === 'formula' && cartItems[i].formula_id === formulaId) {
      cartItems.splice(i, 1);
      break;
    }
  }
  updateCartBar();
  const container = document.getElementById('formula-steps-' + formulaId);
  const remaining = cartItems.filter(i => i.type === 'formula' && i.formula_id === formulaId);
  if (remaining.length === 0) {
    if (container) container.style.display = 'none';
  } else {
    // Still some in cart — show last success
    showFormulaSuccess(formulaId, remaining[remaining.length - 1].choices);
  }
};

// ── Cart ───────────────────────────────────────────────────────────────────
function updateCartBar() {
  const total = cartItems.reduce((s, i) => s + (i.qty || 1), 0);
  const bar = document.getElementById('cart-bar');
  bar.style.display = total > 0 ? 'flex' : 'none';
  document.getElementById('cart-count').textContent = total + ' article' + (total > 1 ? 's' : '');
}

function openOrder() {
  const list = document.getElementById('order-items-list');
  let totalAmt = 0;
  let rowsHtml = '';

  for (const item of cartItems) {
    if ((item.qty || 1) < 1) continue;
    const sub = item.price * (item.qty || 1);
    totalAmt += sub;

    if (item.type === 'formula') {
      const choiceLines = Object.entries(item.choices || {})
        .map(([c, o]) => `${escH(c)}: ${escH(o)}`)
        .join(' · ');
      rowsHtml += `
        <div class="order-row">
          <span class="order-row-price">${sub.toFixed(2)} MAD</span>
          <div class="order-row-title">🍽️ ${escH(item.name_fr)}</div>
          ${choiceLines ? `<div class="order-row-detail">${choiceLines}</div>` : ''}
        </div>`;
    } else {
      rowsHtml += `
        <div class="order-row">
          <span class="order-row-price">${sub.toFixed(2)} MAD</span>
          <div class="order-row-title">${escH(item.name_fr)} × ${item.qty}</div>
        </div>`;
    }
  }

  list.innerHTML = rowsHtml;
  document.getElementById('order-total').textContent = 'Total : ' + totalAmt.toFixed(2) + ' MAD';
  document.getElementById('order-modal').style.display = 'flex';
}

function closeOrder() {
  document.getElementById('order-modal').style.display = 'none';
}

async function submitOrder() {
  const btn = document.getElementById('send-btn');
  btn.disabled = true;
  btn.textContent = 'Envoi en cours...';

  const items = cartItems.filter(i => (i.qty || 1) >= 1).map(i => {
    if (i.type === 'formula') {
      return { type: 'formula', formula_id: i.formula_id, name_fr: i.name_fr, price: i.price, quantity: 1, choices: i.choices };
    }
    return { type: 'item', id: i.id, name_fr: i.name_fr, name_ar: i.name_ar, price: i.price, quantity: i.qty };
  });

  const notes = document.getElementById('order-notes').value;
  try {
    const res = await fetch('/api/order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ property_id: PROPERTY_ID, table_id: TABLE_ID, table_label: TABLE_LABEL, items, notes, session_token: SESSION }),
    });
    if (res.ok) {
      document.getElementById('menu-screen').style.display = 'none';
      document.getElementById('cart-bar').style.display = 'none';
      document.getElementById('order-modal').style.display = 'none';
      document.getElementById('success-screen').style.display = 'block';
    } else {
      btn.disabled = false;
      btn.textContent = '✓ Envoyer la commande';
      alert("Erreur lors de l'envoi. Réessayez.");
    }
  } catch(e) {
    btn.disabled = false;
    btn.textContent = '✓ Envoyer la commande';
    alert('Erreur réseau. Vérifiez votre WiFi.');
  }
}

loadMenu();
</script>
